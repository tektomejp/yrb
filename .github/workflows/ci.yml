name: CI

on:
  push:
    branches:
      - main
      - upgrade/yrs-0.27
    tags:
      - 'v*'

  pull_request:
  workflow_dispatch:

jobs:
  fresh_install:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
    steps:
      - uses: actions/checkout@v6
      - uses: oxidize-rb/actions/setup-ruby-and-rust@main
        with:
          ruby-version: "4.0"
          bundler-cache: false
          cargo-cache: false
      - name: Verify a fresh Git installation replaces the broken build dependency
        run: ruby test/fresh_install.rb

  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        ruby: ["3.1", "3.2", "3.3", "3.4", "4.0"]
    steps:
      - uses: actions/checkout@v6

      - uses: oxidize-rb/actions/setup-ruby-and-rust@main
        with:
          rubygems: latest
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          cargo-cache: true
          cache-version: v1

      - name: Run ruby tests
        run: bundle exec rake

      - name: Lint rust
        run: |
          cargo clippy
          cargo fmt --check
